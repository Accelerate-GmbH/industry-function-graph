# SPDX-License-Identifier: MIT

# Keeps generated/ honest: the graph and the matrix are built from data/*.csv, so
# a pull request that edits the data without rebuilding — or that breaks a
# reference between the layers — fails here rather than being noticed later.

name: Validate

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Optional in validate.py so that a plain Python 3 checkout still works;
      # required here, because CI is where the RDF parse, the Turtle/JSON-LD
      # equivalence check and the SHACL shapes have to actually run.
      - name: Install rdflib and pyshacl
        run: pip install rdflib pyshacl

      - name: Validate the data
        run: python3 build/validate.py

      - name: Check generated/ is up to date
        run: python3 build/build.py --check